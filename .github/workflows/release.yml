name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build portable Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p mtr-oudia-gpui

      - name: Publish draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="mtr-link-oudia_${VERSION}_windows_x64.exe"
          cp target/release/mtr-link-oudia.exe "${ASSET}"
          gh release create "${GITHUB_REF_NAME}" "${ASSET}" \
            --draft \
            --title "mtr-link-oudia ${GITHUB_REF_NAME}" \
            --notes $'インストール不要のWindows版です。\n\n`mtr-link-oudia.exe`をダウンロードして直接起動してください。'

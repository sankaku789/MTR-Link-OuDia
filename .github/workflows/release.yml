name: Release 

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build portable Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish portable EXE
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "mtr-link-oudia ${{ github.ref_name }}"
          releaseBody: |
            インストール不要のWindows版です。

            `mtr-link-oudia.exe`をダウンロードして直接起動してください。
          releaseDraft: true
          prerelease: false
          tauriScript: npm run tauri
          args: --no-bundle
          uploadPlainBinary: true
          releaseAssetNamePattern: "mtr-link-oudia_[version]_windows_[arch].[ext]"
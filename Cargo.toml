[workspace]
resolver = "2"
members = [
    "crates/mtr-oudia-domain",
    "crates/mtr-oudia-application",
    "crates/mtr-oudia-infrastructure",
    "crates/mtr-oudia-gpui",
]

[workspace.package]
edition = "2024"
version = "2.0.0"

# Linux 検証用の回避策。xattr 0.2.3 は Linux でも libc::ENOATTR (macOS 専用) を参照して
# コンパイルできないため、ENODATA に直したローカルコピーを使う。
# Windows ビルドには影響しない。
[patch.crates-io]
xattr = { path = "crates/mtr-oudia-gpui/vendor/xattr" }
